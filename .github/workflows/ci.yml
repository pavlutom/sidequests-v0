name: Backend CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up environment
        run: cp .env.example .env

      - name: Start services and build
        run: docker compose up -d --build

      - name: Wait for database
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          until docker compose exec db pg_isready -U sidequests; do
            sleep 1
          done

      - name: Run Pytest with Coverage
        run: docker compose exec -T backend pytest

      - name: Generate Coverage Badge
        if: github.ref == 'refs/heads/main'
        run: docker compose exec -T backend coverage-badge -o coverage.svg -f

      - name: Copy badge to host
        if: github.ref == 'refs/heads/master'
        run: docker cp $(docker compose ps -q backend):/app/coverage.svg ./backend/coverage.svg

      - name: Commit Coverage Badge
        if: github.ref == 'refs/heads/master'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add backend/coverage.svg
          if git diff-index --quiet HEAD; then
            echo "No changes in coverage badge"
          else
            git commit -m "chore: update coverage badge [skip ci]"
            git push
          fi
