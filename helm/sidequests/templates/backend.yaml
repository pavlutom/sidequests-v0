apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sidequests.fullname" . }}-backend-config
  labels:
    {{- include "sidequests.labels" . | nindent 4 }}
data:
  DATABASE_HOST: {{ .Values.backend.config.databaseHost | quote }}
  DATABASE_PORT: {{ .Values.backend.config.databasePort | quote }}
  DATABASE_NAME: {{ .Values.backend.config.databaseName | quote }}
  CORS_ORIGINS: {{ .Values.backend.config.corsOrigins | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sidequests.fullname" . }}-backend
  labels:
    {{- include "sidequests.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "sidequests.selectorLabels" . | nindent 4 }}
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sidequests.fullname" . }}-backend
  labels:
    {{- include "sidequests.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "sidequests.selectorLabels" . | nindent 6 }}
      app: backend
  template:
    metadata:
      labels:
        {{- include "sidequests.selectorLabels" . | nindent 8 }}
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "sidequests.fullname" . }}-backend-config
          env:
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "sidequests.fullname" . }}-db-secret
                  key: POSTGRES_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sidequests.fullname" . }}-db-secret
                  key: POSTGRES_PASSWORD
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
