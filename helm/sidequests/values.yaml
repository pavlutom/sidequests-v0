# Default values for sidequests.

global:
  namespace: sidequests

backend:
  replicaCount: 2
  image:
    repository: sidequests-backend
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  config:
    databaseHost: "sidequests-db"
    databasePort: "5432"
    databaseName: "sidequests"
    corsOrigins: '["https://app.localtest.me"]'
    debug: "false"
    accessTokenExpireMinutes: "10080"
    generatorType: "hardcoded"
    openaiModel: ""
    timezone: "UTC"
  secrets:
    secretKey: "yoursecretkeyhere"
    openaiApiKey: "your_openai_api_key_here"

frontend:
  replicaCount: 2
  image:
    repository: sidequests-frontend
    tag: latest
    pullPolicy: IfNotPresent
  config:
    viteApiUrl: "https://app.localtest.me/api"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

postgres:
  image:
    repository: postgres
    tag: 15-alpine
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    size: 5Gi
  auth:
    user: sidequests
    password: password
    database: sidequests

ingress:
  enabled: true
  className: nginx
  host: app.localtest.me
  tls:
    enabled: true
    secretName: sidequests-tls

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
