apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: sidequests
data:
  DATABASE_URL: "postgresql://sidequests:password@db:5432/sidequests"
  CORS_ORIGINS: '["http://app.localtest.me"]'
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: sidequests
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: sidequests
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: sidequests-backend:local
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3